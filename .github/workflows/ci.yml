name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      TOKENMAX_FORCE_INSTALLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install editable CLI and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Verify installed command and safety contract
        run: |
          tokenmax --version
          tokenmax doctor --json
          tokenmax list-sites --json
          tokenmax owner-map --input tests/fixtures/owner-map.valid.json --json
      - name: Build distribution artifacts
        run: python -m build --outdir .artifacts
      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('.artifacts/*.whl')[0]])"
      - name: Smoke-test wheel resources outside the checkout
        working-directory: ${{ runner.temp }}
        run: tokenmax doctor --json
      - name: Exercise installed wheel in an isolated workspace
        run: python tools/wheel_smoke.py
