name: token-max-site-factory
description: |
  Bootstrap for token-max-site-factory — a point-and-shoot programmatic
  SEO/GEO page factory with hard quality gates (2,800-3,400 words per page,
  shingle/Jaccard overlap <= 0.10, answer-first GEO structure, packet-only
  facts) that NEVER deploys, touches DNS, Search Console, sitemaps, or
  indexing. This workflow only verifies prerequisites, clones the engine repo
  to ~/token-max-site-factory if absent, and prints the point-and-shoot
  onboarding steps. Page generation itself runs from YOUR target repo via the
  per-site workflow the engine installs (a preflight node re-verifies the
  no-live-mutation contract on every run).
  Engine + docs: https://github.com/TheSmokeDev/token-max-site-factory
  NOTE: node scripts are dollar-free on purpose — Archon 0.5.0 blanks
  dollar-sign tokens in inline scripts.
provider: codex
interactive: false

nodes:
  - id: check-prereqs
    timeout: 60000
    bash: |
      set -e
      command -v git >/dev/null 2>&1 || { echo "MISSING PREREQ: git"; exit 1; }
      if command -v python3 >/dev/null 2>&1 || command -v python >/dev/null 2>&1; then
        echo "python found"
      else
        echo "MISSING PREREQ: python3 (3.10+ with PyYAML)"
        exit 1
      fi
      echo "<promise>PREREQS_OK</promise>"

  - id: fetch-engine
    depends_on: [check-prereqs]
    timeout: 300000
    bash: |
      set -e
      cd ~
      if [ -e token-max-site-factory/engine/tmsf.sh ]; then
        echo "engine already present at ~/token-max-site-factory (leaving it untouched)"
      else
        git clone --depth 1 https://github.com/TheSmokeDev/token-max-site-factory.git
      fi
      echo "<promise>ENGINE_READY</promise>"

  - id: onboarding-instructions
    depends_on: [fetch-engine]
    timeout: 60000
    bash: |
      set -e
      echo "token-max-site-factory is ready at ~/token-max-site-factory"
      echo ""
      echo "Point-and-shoot (run from that directory):"
      echo "  1. python engine/token_max_site_factory.py new-site --site <id> --target-repo <path>"
      echo "  2. python engine/token_max_site_factory.py scan --site <id> --allow-network"
      echo "  3. edit sites/<id>/site.yaml  (start from sites/example/site.yaml)"
      echo "  4. python engine/token_max_site_factory.py install --site <id> --run-input pilot-10"
      echo "  5. cd <target-repo> && archon workflow run token-max-site-factory-<id> --no-worktree"
      echo ""
      echo "Pilot 10-25 pages before any tranche; keep tranches <= 300 pages."
      echo "Docs: https://github.com/TheSmokeDev/token-max-site-factory#readme"
      echo "<promise>ONBOARDING_PRINTED</promise>"
